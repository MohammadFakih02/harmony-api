name: CD

# Builds the API image and pushes it to GHCR on every push to main. With main protected, that means
# on every merged PR — and because the PR had to pass the CI workflow (build + full integration suite)
# to merge, this runs on already-gated code; it deliberately does not re-run the test suite. The server
# never builds anything: it only ever `docker compose pull`s these images (see AWS-HOSTING.md Step 0c).
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR using the built-in GITHUB_TOKEN — no PAT stored anywhere.

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags per build, exactly as the runbook documents:
      #   latest            — what the server pulls by default
      #   sha-<short-commit> — immutable handle for rollback / pinning the demo (IMAGE_TAG in .env)
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mohammadfakih02/harmony-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
